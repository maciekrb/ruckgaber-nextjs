apiVersion: skaffold/v2beta17
kind: Config
metadata:
  name: ruckgaber-site
build:
  artifacts:
  - image: ruckgaber-site
    context: .
    docker:
      dockerfile: Dockerfile
    sync:
      manual:
        - src: 'src/*'
          dest: '/app'
deploy:
  kubeContext: minikube
  kustomize:
    paths:
    - .k8s/local-dev

portForward:
- resourceType: Service
  resourceName: ruckgaber-site
  namespace: default
  port: 3000

profiles:
- name: prod
  deploy:
    kubeContext: trappist
    kustomize:
      paths:
      - .k8s/prod
