kind: Service
apiVersion: v1
metadata:
  name: ruckgaber-site
spec:
  selector:
    app: ruckgaber-site

  ports: # define which ports are in use
    - name: http
      port: 3000
  type: NodePort
---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: ruckgaber-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruckgaber-site
  template:
    metadata:
      labels:
        app: ruckgaber-site
    spec:
      containers:
      - name: ruckgaber-site
        image: ruckgaber-site
        imagePullPolicy: "IfNotPresent"
        ports:
          - containerPort: 3000
